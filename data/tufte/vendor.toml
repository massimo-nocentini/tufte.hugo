# Third-party assets used by tufte.hugo (read by layouts/_partials/tufte/katex.html
# and emitted by layouts/_partials/tufte/vendor.html).
#
# KaTeX: one [[katex]] entry per bundled KaTeX release, NEWEST FIRST. The
# first entry is the release that the minimum Hugo's transform.ToMath
# (build-time KaTeX) embeds, and the one the theme loads by default
# (params.math.katexVersion = "auto"), so that the stylesheet matches the
# HTML Hugo generates: KaTeX 0.18 renamed the classes of its output
# (base -> katex-base, strut -> katex-strut, tag -> katex-tag, sizing ->
# katex-sizing), and another release's stylesheet may leave that output
# unstyled. The client engine loads the JS of the same entry, so stylesheet
# and script always agree. When a new minimum Hugo embeds a newer KaTeX,
# put its entry first.
#
#   version  the KaTeX version in the URLs (params.math.katexVersion is
#            compared to it)
#   css, js, autorender
#            url        CDN link, pinned to the exact version
#            integrity  its SRI hash (sha384); bump url and hash together
#   dir      where the files are published with params.selfHosted = true
#
# With params.selfHosted = true the theme downloads each file at build time
# (resources.GetRemote), checks it against the hash and serves it from the
# site. The KaTeX stylesheet loads its fonts from "fonts/" next to itself, so
# a self-hosted site must copy KaTeX's dist/fonts/ (of the same version) to
# static/katex/fonts/.
#
# Hashes computed with:
#   curl -sL URL | openssl dgst -sha384 -binary | openssl base64 -A

[[katex]]
version = "0.18.4"
dir = "katex"
  [katex.css]
  url = "https://cdn.jsdelivr.net/npm/katex@0.18.4/dist/katex.min.css"
  integrity = "sha384-u1zONI5gPXUx0UKI62c75/zww972y0v2rSK5ZYlVdS6xEuWDeZWUI66v6t1gvlXJ"
  [katex.js]
  url = "https://cdn.jsdelivr.net/npm/katex@0.18.4/dist/katex.min.js"
  integrity = "sha384-ykMNcWQhhTUb0YV9SPpPUFURHZ+tWmubkakGBP+OgNK/UXdO2gtzglWx0Rj9hnO3"
  [katex.autorender]
  url = "https://cdn.jsdelivr.net/npm/katex@0.18.4/dist/contrib/auto-render.min.js"
  integrity = "sha384-bjyGPfbij8/NDKJhSGZNP/khQVgtHUE5exjm4Ydllo42FwIgYsdLO2lXGmRBf5Mz"

# Fuse.js, the fuzzy search of params.search (layouts/_partials/tufte/search/,
# assets/tufte/search.js). Since 7.3 Fuse.js ships only ES modules: the
# search script loads this file as <script type="module" integrity=…> on the
# first search, then imports the same URL, which the browser takes from its
# module map (already checked against the hash) instead of fetching it again.
[fuse]
version = "7.5.0"
url = "https://cdn.jsdelivr.net/npm/fuse.js@7.5.0/dist/fuse.min.mjs"
integrity = "sha384-q0aLEO7RBzlrypvGA6+2CLbdnwCONRgCmmkPYWRTu5isFkLs7tLZshJIZhY5b1Rk"
dir = "fuse"

# reveal.js, the slides output format (layouts/page.slides.html, README
# "Slides"): its core stylesheet (no reveal.js theme: the slides keep the
# theme's typography, assets/css/slides.css), the script (UMD build, the
# global Reveal) and the speaker notes plugin (RevealNotes, the "s" key).
[reveal]
version = "6.0.2"
dir = "reveal"
  [reveal.css]
  url = "https://cdn.jsdelivr.net/npm/reveal.js@6.0.2/dist/reveal.css"
  integrity = "sha384-rKClnwfQQ2b7LYSOAhRvm5m4LS7QKciQTAXBpVvr30y6oGB+ZBBXlpDnvFqlv5Eu"
  [reveal.js]
  url = "https://cdn.jsdelivr.net/npm/reveal.js@6.0.2/dist/reveal.js"
  integrity = "sha384-UilXW7W77EPIY5TmQGBrjhBPcfX40NqGwuIC8DGs6OeGTCxKy36B+DiOXtfqgk9S"
  [reveal.notes]
  url = "https://cdn.jsdelivr.net/npm/reveal.js@6.0.2/dist/plugin/notes.js"
  integrity = "sha384-XUVoTb/UbE06yoCUaqswCPKSUvPq3q4heijGsemnUSS/JEgW1lNnK0rKlNwjuz7O"
