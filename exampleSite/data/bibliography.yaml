# Site bibliography, in the theme's native (BibTeX-like) schema.
#
# A hand conversion of tufte-latex's sample-handout.bib. Keys are lowercase
# (cite keys are matched case-insensitively), `\LaTeX` became plain "LaTeX"
# and `--` an en dash. Tufte2006's non-standard `place` field is left out:
# BibTeX ignores it, so the reference PDFs print no address for that book
# (the theme would read `place` as an alias of `address`).
#
# The same file could be produced from a .bib database with pandoc, as
# CSL-JSON (also understood by the theme):
#   pandoc sample-handout.bib -t csljson -o data/bibliography.json

tufte2006:
  type: book
  author: Edward R. Tufte
  title: Beautiful Evidence
  publisher: Graphics Press, LLC
  year: 2006
  month: May
  edition: First
  isbn: 0-9613921-7-7

tufte2001:
  type: book
