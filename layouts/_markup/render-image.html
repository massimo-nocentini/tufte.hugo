{{- /*
  Image render hook.

  - Inline images (inside a paragraph) become a plain <img loading="lazy">.
  - Block images (on their own line) become figures, rendered by the
    partial tufte/figure.html:
      ![Alt](exports-imports.png "Caption, *Markdown* allowed")
        → <figure> with the title as a margin-note caption
      ![Alt](quilt.png)
        → <figure><img …/></figure>
    A class attribute picks the figure type (needs block attributes):
      ![Alt](napoleons-march.png "Caption")
      {.fullwidth}                    → <figure class="fullwidth"> … <figcaption>
      {.margin}                       → margin figure (image in a margin note)

  Block images are recognised through .IsBlock, which requires
    [markup.goldmark.parser]
      wrapStandAloneImageWithinParagraph = false
  and Markdown attributes ({.fullwidth}, {width=300}) require
    [markup.goldmark.parser.attribute]
      block = true
  Without the first setting every image is rendered inline.

  LaTeX-like attributes on block images (SPEC-LATEX §3.4):
      ![Alt](sine.svg "Caption")
      {#fig:sine short="Sine" captionpos="bottom" offset="-1bl" cite="tufte2006" numbered=false}
    id → the label (xref "fig:sine"), short → the list-of-figures caption,
    captionpos top|bottom, offset (1bl, -2rem…), cite (citation keys),
    numbered (true|false).

  The source is resolved as a page resource, then an assets/ resource,
  then a plain URL (paths starting with "/" are static/ paths).

  The alt text is plain text: Markdown in it is dropped, math kept as its
  TeX source ($x^2$). A shortcode, a nest token or a footnote reference
  [^x] in it cannot be written into the attribute (a shortcode is still
  Hugo's placeholder here, and its HTML would land inside alt="…"): the
  alt is deferred (tufte/attr-marks.html), and its notes, citations and
  footnotes follow the img once the shortcodes have run.
*/ -}}
{{- $attrs := dict -}}
{{- $classes := slice -}}
{{- $width := "" -}}
{{- $height := "" -}}
{{- $latex := dict -}}
{{- $latexKeys := slice "id" "short" "captionpos" "offset" "cite" "numbered" -}}
{{- range $k, $v := .Attributes -}}
  {{- if eq $k "class" -}}
    {{- /* Split on whitespace (findRE returns every match). */ -}}
    {{- $classes = findRE `\S+` (printf "%v" $v) -}}
  {{- else if eq $k "width" -}}
    {{- $width = $v -}}
  {{- else if eq $k "height" -}}
    {{- $height = $v -}}
  {{- else if in $latexKeys (lower $k) -}}
    {{- $latex = merge $latex (dict (lower $k) $v) -}}
  {{- else -}}
    {{- $attrs = merge $attrs (dict $k $v) -}}
  {{- end -}}
{{- end -}}
{{- /* Alt text (see above). */ -}}
{{- $alt := .PlainText -}}
{{- $altText := string .Text -}}
{{- $altKey := "" -}}
{{- $tokRE := `HAHAHUGOSHORTCODE|TUFTENEST[0-9a-f]{16}END` -}}
{{- if or (strings.Contains $altText "<") (findRE $tokRE $altText 1) -}}
  {{- $defer := or (findRE $tokRE $altText 1) (strings.Contains $altText "footnote-ref") -}}
  {{- if not $defer -}}
    {{- $tip := partial "tufte/img-tip.html" $altText -}}
    {{- if $tip.notes }}{{ $defer = true }}{{ else }}{{ $alt = htmlUnescape $tip.title }}{{ end -}}
  {{- end -}}
  {{- if $defer -}}
    {{- $altKey = substr (md5 (printf "%s|%d|%s|%s" .Page.RelPermalink .Ordinal .Destination $altText)) 0 12 -}}
    {{- $alt = printf "TUFTEATTR%sEND" $altKey -}}
  {{- end -}}
{{- end -}}
{{- /* Inside the subfigures shortcode (tufteRawImgTitles, below) every
       image is a grid cell, never a figure of its own: a linked image
       ([![alt](src "Title")](url)) and an image alone on its lines reach
       this hook with .IsBlock = true, and as a figure its title would be a
       caption printed after the link instead of the cell's subcaption. */ -}}
{{- if and .IsBlock (not (.Page.Store.Get "tufteRawImgTitles")) -}}
  {{- $type := "main" -}}
  {{- $rest := slice -}}
  {{- range $classes -}}
    {{- if eq . "fullwidth" -}}
      {{- $type = "fullwidth" -}}
    {{- else if in (slice "margin" "marginfigure" "marginnote") . -}}
      {{- $type = "margin" -}}
    {{- else -}}
      {{- $rest = $rest | append . -}}
    {{- end -}}
  {{- end -}}
  {{- $out := partial "tufte/figure.html" (dict
    "Page" .Page
    "ResPage" .PageInner
    "Src" .Destination
    "Alt" $alt
    "Caption" .Title
    "Type" $type
    "Width" $width
    "Height" $height
    "Class" (delimit $rest " ")
    "Attrs" $attrs
    "Label" (index $latex "id" | default "")
    "Short" (index $latex "short" | default "")
    "Numbered" (index $latex "numbered")
    "CaptionPos" (index $latex "captionpos" | default "")
    "Offset" (index $latex "offset" | default "")
    "Cite" (index $latex "cite" | default "")
  ) -}}
  {{- with $altKey -}}
    {{- $out = printf `%s<i class="tufte-attr" data-key="%s" data-at="img"%s hidden></i>%s<i class="tufte-attr-end" hidden></i>` $out . (cond (eq $type "margin") ` data-in="note"` "") $altText -}}
  {{- end -}}
  {{- $out | safeHTML -}}
{{- else -}}
  {{- /* A shortcode in the title is still Hugo's placeholder here, which
         Hugo would replace with the shortcode's HTML inside the attribute:
         the title is marked after the img instead, and
         func/content-raw.html makes it the tooltip once the shortcode has
         run (its notes and citations follow the img: tufte/img-tips.html).
         Inside a theme shortcode's inner text a nested shortcode is a nest
         token instead, which tufte/render-inner.html would swap for the
         shortcode's HTML inside the attribute: the same marks, with the
         token kept as TUFTENESTTIP…END, which render-inner swaps and
         resolves once the HTML is known (or the subfigures shortcode
         renders as a subcaption, Markdown and all). */ -}}
  {{- $tip := "" -}}
  {{- /* The title as written, with its backslash escapes and entities
         resolved like Goldmark would (tufte/md-title.html); a block
         image's title is a caption, rendered as Markdown instead, and so
         is the title of an image in the subfigures shortcode (it becomes a
         subcaption): that shortcode sets tufteRawImgTitles around its
         rendering of the images, which keeps the title as written. */ -}}
  {{- $title := .Title -}}
  {{- if not (.Page.Store.Get "tufteRawImgTitles") }}{{ $title = partial "tufte/md-title.html" .Title }}{{ end -}}
  {{- with $title -}}
    {{- if or (strings.Contains . "HAHAHUGOSHORTCODE") (findRE `TUFTENEST[0-9a-f]{16}END` . 1) -}}
      {{- $t := htmlEscape . | replaceRE `TUFTENEST([0-9a-f]{16}END)` "TUFTENESTTIP$1" -}}
      {{- $tip = printf `<i class="tufte-tip" hidden></i>%s<i class="tufte-tip-end" hidden></i>` $t -}}
    {{- else -}}
      {{- $attrs = merge $attrs (dict "title" .) -}}
    {{- end -}}
  {{- end -}}
  {{- /* An id on an inline image stays on the img. */ -}}
  {{- with index $latex "id" -}}
    {{- $attrs = merge $attrs (dict "id" .) -}}
  {{- end -}}
  {{- $out := partial "tufte/figure.html" (dict
    "Page" .Page
    "ResPage" .PageInner
    "Src" .Destination
    "Alt" $alt
    "Type" "inline"
    "Width" $width
    "Height" $height
    "Class" (delimit $classes " ")
    "Attrs" $attrs
  ) -}}
  {{- with $altKey -}}
    {{- $tip = printf `%s<i class="tufte-attr" data-key="%s" data-at="img" hidden></i>%s<i class="tufte-attr-end" hidden></i>` $tip . $altText -}}
  {{- end -}}
  {{- printf "%s%s" $out $tip | safeHTML -}}
{{- end -}}
