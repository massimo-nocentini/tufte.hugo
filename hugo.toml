# tufte.hugo — theme configuration (defaults).
#
# Hugo merges only some sections of a theme configuration into the site
# configuration: [params] are merged deeply and site values always win;
# [menus] are merged shallowly (this theme defines none). [markup],
# [taxonomies], [pagination] and [services] are NOT merged by default, so the
# Goldmark settings this theme relies on must live in the site configuration
# (see README.md and exampleSite/hugo.toml); a site can opt in to merging with
# `_merge = "deep"` under its [markup].

[module]
  [module.hugoVersion]
    min = "0.169.0"
    extended = false # no SCSS, no WebP encoding: the standard edition is enough
  # Hugo's default mounts (a module that lists mounts gets no defaults),
  # plus i18n/en.yaml as an asset: func/t.html reads it as the English
  # fallback of a language that has no i18n file of the theme.
  [[module.mounts]]
    source = "archetypes"
    target = "archetypes"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "data"
    target = "data"
  [[module.mounts]]
    source = "i18n"
    target = "i18n"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "i18n/en.yaml"
    target = "assets/tufte/i18n-en.yaml"

[params]
  subtitle = ""                 # shown under the site title on the home page
  description = ""              # last fallback <meta name="description"> (after page description, subtitle, summary)
  dateFormat = ""                # Go layout of dates; "" = the language's i18n dateFormat (":date_long", the localized long date, in every theme language)
  archiveDateFormat = ""        # Go layout of the archive's month and day; "" = the language's i18n archiveDateFormat ("Jan 2", "2 Jan", …; else English's)
  sections = "h2"               # "h2" | "none" — wrap content in <section> at each h2 (front matter `sections` overrides)
  footnotes = "sidenotes"       # "sidenotes" | "endnotes" (front matter `footnotes` overrides)
  etBook = true                 # load the bundled ET Book web fonts
  showReadingTime = true
  showWordCount = false
  showPostNav = true            # previous / next links at the end of posts
  toc = false                   # table of contents (front matter `toc` overrides)
  readMore = true               # "Read more" link under summaries Hugo cut (.Truncated)
  homeIntro = true              # render content/_index.md above the home list
  customCSS = []                # paths under the site's assets/, appended to the CSS bundle
  copyright = ""                # footer text; default "© YEAR Author"
  selfHosted = false            # true: download third-party files (KaTeX) at build time and serve them from the site

  [params.author]
    name = ""
    email = ""
    url = ""

  [params.social]
    github = ""
    gitlab = ""
    mastodon = ""
    bluesky = ""
    twitter = ""
    linkedin = ""
    orcid = ""
    email = ""
    rss = true

  # Math is typeset with KaTeX. URLs and SRI hashes: data/tufte/vendor.toml.
  [params.math]
    enable = "auto"             # "auto" (only pages that contain math) | true | false
    engine = "server"           # "server" (build-time KaTeX, no JS) | "client" (KaTeX JS in the browser)
    fleqn = false               # display math flush left
    leqno = false               # equation numbers on the left: \label numbers and \tag
    errorColor = ""             # colour of invalid TeX ("" = the theme's red, adapted to dark mode)
    strict = "error"            # KaTeX strict mode: "error" | "ignore" | "warn"
    minRuleThickness = 0.04     # minimum fraction-line thickness, in em
    katexVersion = "auto"       # "auto": the KaTeX release Hugo embeds (0.18.4); another version needs katexIntegrity, katexJSIntegrity, katexAutoRenderIntegrity unless listed in data/tufte/vendor.toml
    katexCSS = ""               # optional: another KaTeX stylesheet URL (with katexIntegrity)
    katexIntegrity = ""
    katexJSIntegrity = ""
    katexAutoRenderIntegrity = ""
    # Macros, merged with front matter `mathMacros` (the page wins). Hugo
    # lowercases map keys, so names with capitals need the list form:
    #   macros = [["\\RR", "\\mathbb{R}"], ["\\abs", "\\left|#1\\right|"]]
    macros = []

  [params.giscus]               # enabled only when repo, repoId, category and categoryId are all set
    repo = ""
    repoId = ""
    category = ""
    categoryId = ""
    mapping = "pathname"
    theme = "preferred_color_scheme"
    lang = ""                   # giscus interface language ("" = the site language)

  [params.comments]
    enable = true               # front matter `comments` overrides

  # tufte-latex parity. Only the style preset is set here: every other
  # [params.tufte] key is optional and its default comes from the preset
  # (layouts/_partials/tufte/defaults.html), so that `style = "latex"` can
  # change them. Setting a leaf here would hide the preset's value. All keys
  # are documented in README.md ("tufte-latex parity").
  [params.tufte]
    style = "css"               # "css" (Tufte CSS look) | "latex" (tufte-handout / tufte-book look)

# Single-document print view of a book: a book root with
# `outputs: [html, rss, print]` gets /…/print.html (layouts/list.print.html).
# Front-matter `outputs` replaces the defaults: leaving out rss drops the feed.
# noUgly: with `uglyURLs = true`, Hugo writes some list pages as `x.html`
# (taxonomy terms); a print output would then go to that same file and
# replace the HTML page. noUgly keeps it at x/print.html.
[outputFormats]
  [outputFormats.print]
    mediaType = "text/html"
    baseName = "print"
    isHTML = true
    noUgly = true
    permalinkable = false
    notAlternative = true

# BibTeX databases as page resources or assets (`bibliography: refs.bib`).
[mediaTypes]
  [mediaTypes."text/x-bibtex"]
    suffixes = ["bib"]
