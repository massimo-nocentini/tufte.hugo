# The date of the post metadata, summaries and title blocks, unless
# params.dateFormat is set: a Go layout (Hugo translates the month names) or
# ":date_long", the language's own long date ("March 5, 2024", "5 marzo 2024",
# "5. März 2024"). Keep it ":date_long" here: Hugo's T gives a language without
# the key the default language's value, so a Go layout here would put every
# such language in English order ("março 5, 2024").
dateFormat: ":date_long"
# The RSS feed of a section or term ("Posts on Site"), and its description.
