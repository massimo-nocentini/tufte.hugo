name: Build example site

on:
  push:
    branches: ["master", "main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hugo: ["latest"] # the theme requires the latest Hugo release (min 0.169.0)
    defaults:
      run:
        # exampleSite/hugo.toml uses theme = "tufte.hugo" and themesDir = "../..",
        # so the theme must be checked out in a directory named tufte.hugo.
        working-directory: tufte.hugo/exampleSite
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: tufte.hugo

      # "latest" is resolved here from the GitHub releases API, as pages.yml
      # does, so that CI and the Pages deployment build with the same Hugo
      # (actions-hugo would resolve "latest" from the Homebrew formula, which
      # can lag behind a new release).
      - name: Resolve Hugo ${{ matrix.hugo }}
        id: hugo
        env:
          HUGO: ${{ matrix.hugo }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$HUGO" = latest ]; then
            tag=$(curl -sSfL --retry 3 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              https://api.github.com/repos/gohugoio/hugo/releases/latest |
              python3 -I -c 'import json, sys; print(json.load(sys.stdin)["tag_name"])')
            HUGO=${tag#v}
          fi
          [[ "$HUGO" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::unexpected Hugo version '$HUGO'"; exit 1; }
          echo "Hugo $HUGO"
          echo "version=$HUGO" >> "$GITHUB_OUTPUT"

      - name: Setup Hugo ${{ steps.hugo.outputs.version }}
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ steps.hugo.outputs.version }}
          extended: false # the theme needs only the standard edition

      - name: Hugo version
        run: hugo version

      - name: Build (defaults)
        run: hugo --gc --panicOnWarning --destination public

      - name: Check Tufte markup
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          need() { [ -f "$1" ] || fail "missing $1"; }

          P=public/posts/tufte-css/index.html
          need "$P"
          grep -q 'class="margin-toggle sidenote-number"' "$P" || fail "no sidenote in $P"
          grep -q 'class="marginnote"' "$P" || fail "no margin note in $P"
          grep -q '<section' "$P" || fail "no <section> in $P"
          grep -q 'class="epigraph"' "$P" || fail "no epigraph in $P"

          F=public/posts/footnotes-as-sidenotes/index.html
          need "$F"
          grep -q 'class="sidenote"' "$F" || fail "footnotes not converted to sidenotes in $F"
          if grep -q '<div class="footnotes"' "$F"; then fail "Goldmark endnote div left in $F"; fi

          M=public/posts/math-and-code/index.html
          need "$M"
          grep -q 'class="katex' "$M" || fail "no KaTeX output in $M"
          grep -q 'katex.min.css' "$M" || fail "KaTeX stylesheet not loaded in $M"
          if grep -q 'class="math-error"' "$M"; then fail "invalid TeX (math-error) in $M"; fi
          # KaTeX 0.18 renders \tag as <span class="katex-tag">; post-meta tag
          # links use class "post-tag".
          grep -q '<span class="katex-tag">' "$M" || fail "no equation \\tag in $M"
          # The stylesheet must be the KaTeX release Hugo embeds (class names
          # changed in 0.18): katex-base in the HTML needs katex@0.18+ CSS.
          grep -q 'class="katex-base"' "$M" || fail "no KaTeX 0.18 output (katex-base) in $M: has Hugo's embedded KaTeX changed? Update data/tufte/vendor.toml"
          grep -qE 'katex@0\.(1[89]|[2-9][0-9])\.[0-9]+/dist/katex\.min\.css' "$M" || fail "KaTeX 0.18 HTML with an older katex.min.css in $M"
          # katex.min.css, linked after the theme bundle, has
          # body{counter-reset:katexEqnNo mmlEqnNo}, which would replace
          # tufte.css's body sidenote-counter reset (notes would restart at 1
          # in every paragraph): the bundle resets all three on html body.
          B=public$(grep -oE '/css/tufte-hugo[^" >]*\.css' "$M" | head -1)
          need "$B"
          tr -d '\n' < "$B" | grep -qE 'html body ?\{ *counter-reset: ?sidenote-counter katexEqnNo mmlEqnNo' || fail "no html body counter reset (sidenote-counter katexEqnNo mmlEqnNo) in $B"

          # Embeds nested in a block shortcode keep their HTML (tufte/nest.html).
          T=public/posts/figures-and-tables/index.html
          need "$T"
          tr -d '\n' < "$T" | grep -qE '<div class="fullwidth">[[:space:]]*<figure class="iframe-wrapper"' || fail "iframe inside fullwidth lost in $T"
          if grep -q 'raw HTML omitted' "$T"; then fail "raw HTML omitted in $T"; fi

          # Note ids must be unique per page, also on list pages with several summaries.
          for f in "$P" "$F" public/index.html public/posts/index.html; do
            need "$f"
            dups=$(grep -o ' id="[^"]*"' "$f" | sort | uniq -d || true)
            [ -z "$dups" ] || fail "duplicate ids in $f: $dups"
          done

      # Euler math (posts/euler-math sets mathFont: euler; README "Euler
      # math"): MathML in KaTeX's katex-mathml span, no KaTeX HTML, the fixes
      # of tufte/mathml-core.html (math alphabets, the space after an
      # operator name, table layout), \tag printed by the theme, and the
      # bundled font with its licence and @font-face.
      - name: Check Euler math
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          E=public/posts/euler-math/index.html
          [ -f "$E" ] || fail "missing $E"
          if grep -q 'katex-html' "$E"; then fail "KaTeX HTML in $E (mathFont: euler)"; fi
          grep -q '<span class="katex tufte-math-euler"><span class="katex-mathml"><math' "$E" || fail "no MathML in a katex-mathml span in $E"
          # a formula and the comma after it stay on one line (func/content-raw.html)
          grep -q '<span class="tufte-nobr"><span class="katex tufte-math-euler">' "$E" || fail "no tufte-nobr span in $E"
          if grep -q 'mathvariant="double-struck"' "$E"; then fail "mathvariant left for \\mathbb in $E"; fi
          grep -q '<mi>ℝ</mi>' "$E" || fail "\\mathbb{R} is not U+211D in $E"
          grep -q '<mi>𝔤</mi>' "$E" || fail "\\mathfrak{g} is not U+1D524 in $E"
          grep -q '<mi>cos</mi><mo rspace="0.1667em">' "$E" || fail "no thin space after \\cos in $E"
          grep -q '<mn>2</mn><mspace width="0.1667em"/><mi>sin</mi>' "$E" || fail "no thin space before \\sin in 2\\sin in $E"
          grep -q '<mo stretchy="false">(</mo><mo lspace="0em" rspace="0em">−</mo>' "$E" || fail "the minus of f(-x) is not unary in $E"
          grep -q '<menclose notation="box">' "$E" || fail "no \\boxed in $E"
          grep -qE '<mtable [^>]*style="--tufte-ca1:-webkit-right;--tufte-ca2:-webkit-left;' "$E" || fail "no column alignment on the aligned table in $E"
          grep -q '<span class="math-display tagged numbered"><span class="katex-display">' "$E" || fail "\\tag not printed by the theme in $E"
          grep -q '<span class="eq-number">(2.26)</span>' "$E" || fail "no (2.26) tag in $E"
          # KaTeX's own MathML tag is a 100%-wide table, which browsers do not lay out
          if grep -q '<mtable width="100%"' "$E"; then fail "KaTeX's \\tag table left in $E"; fi
          grep -q 'href="#eq-binomial">(1)' "$E" || fail "no eqref (1) in $E"
          grep -q 'data-qedhere="2"' "$E" || fail "no claimed \\qedhere symbol in $E"
          grep -q 'katex-html' public/posts/math-and-code/index.html || fail "posts/math-and-code lost KaTeX's HTML (font katex)"
          [ -s public/euler-math/Euler-Math.woff2 ] || fail "missing public/euler-math/Euler-Math.woff2"
          grep -q 'SIL Open Font License' public/euler-math/OFL.txt || fail "missing the font licence"
          B=public$(grep -oE '/css/tufte-hugo[^" >]*\.css' "$E" | head -1)
          [ -f "$B" ] || fail "missing $B"
          grep -qi 'font-family: *"\?euler math' "$B" || fail "no Euler Math @font-face in $B"
          grep -q 'url(\.\./euler-math/Euler-Math\.woff2)\|url("\.\./euler-math/Euler-Math\.woff2")' "$B" || fail "the Euler Math URL is not relative to the bundle in $B"
          # WebKit scatters a table cell's row under an inherited -webkit- alignment (theme.css).
          tr -d ' \n' < "$B" | grep -q 'mtd>\*{text-align:start' || fail "no text-align reset of the MathML cells' content (WebKit) in $B"

      # Libertinus (posts/libertinus sets font and mathFont: libertinus;
      # README "Fonts" and "Euler and Libertinus math"): the class of <html>,
      # Libertinus Math's MathML, the faces with their unicode-range halves
      # and licence, and the ET Book pages untouched.
      - name: Check Libertinus
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          L=public/posts/libertinus/index.html
          [ -f "$L" ] || fail "missing $L"
          grep -q '<html lang="[^"]*" class="tufte-font-libertinus">' "$L" || fail "no tufte-font-libertinus class on <html> in $L"
          if grep -q 'tufte-font-libertinus' public/posts/theme-guide/index.html; then fail "posts/theme-guide (font etbook) has the Libertinus class"; fi
          grep -q '<span class="katex tufte-math-libertinus"><span class="katex-mathml"><math' "$L" || fail "no Libertinus MathML in $L"
          if grep -q 'katex-html' "$L"; then fail "KaTeX HTML in $L (mathFont: libertinus)"; fi
          grep -q 'class="tufte-osf' "$L" || grep -q 'class="[^"]* tufte-osf' "$L" || fail "numerals: oldstyle not applied in $L"
          for f in LibertinusSerif-Regular-latin LibertinusSerif-Regular-ext LibertinusSerif-Italic-latin LibertinusSerif-Bold-latin LibertinusSans-Regular-latin LibertinusMono-Regular-latin LibertinusSerif-Regular-osf LibertinusMath-Regular; do
            [ -s "public/libertinus/$f.woff2" ] || fail "missing public/libertinus/$f.woff2"
          done
          grep -q 'SIL Open Font License' public/libertinus/OFL.txt || fail "missing the Libertinus licence"
          B=public$(grep -oE '/css/tufte-hugo[^" >]*\.css' "$L" | head -1)
          [ -f "$B" ] || fail "missing $B"
          grep -qi 'font-family: *"\?libertinus serif' "$B" || fail "no Libertinus Serif @font-face in $B"
          grep -qi 'font-family: *"\?libertinus math' "$B" || fail "no Libertinus Math @font-face in $B"
          grep -q 'url(\.\./libertinus/LibertinusSerif-Regular-latin\.woff2)\|url("\.\./libertinus/LibertinusSerif-Regular-latin\.woff2")' "$B" || fail "the Libertinus URL is not relative to the bundle in $B"
          grep -q 'unicode-range' "$B" || fail "no unicode-range in $B"
          grep -q '\.tufte-font-libertinus' "$B" || fail "no Libertinus font variables in $B"

      # Source (posts/source sets font: source; README "Fonts"): the class of
      # <html>, Adobe's unchanged faces, the renamed old-style digits and the
      # licence, Source Code Pro as the default monospaced face of the bundle,
      # and the other pages untouched.
      - name: Check Source
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          L=public/posts/source/index.html
          [ -f "$L" ] || fail "missing $L"
          grep -q '<html lang="[^"]*" class="tufte-font-source">' "$L" || fail "no tufte-font-source class on <html> in $L"
          if grep -q 'tufte-font-source' public/posts/theme-guide/index.html; then fail "posts/theme-guide (font etbook) has the Source class"; fi
          grep -q 'class="tufte-osf' "$L" || grep -q 'class="[^"]* tufte-osf' "$L" || fail "numerals: oldstyle not applied in $L"
          for f in SourceSerif4-Regular SourceSerif4-It SourceSerif4-Bold SourceSerif4-BoldIt SourceSans3-Regular SourceSans3-It SourceSans3-Bold SourceSans3-BoldIt SourceCodePro-Regular SourceCodePro-It SourceCodePro-Bold SourceCodePro-BoldIt TufteSerif4OSFDigits-Regular TufteSerif4OSFDigits-It TufteSerif4OSFDigits-Bold TufteSerif4OSFDigits-BoldIt; do
            [ -s "public/source/$f.woff2" ] || fail "missing public/source/$f.woff2"
          done
          grep -q 'SIL Open Font License' public/source/OFL.txt || fail "missing the Source licence"
          grep -q "Reserved Font Name" public/source/OFL.txt || fail "the Source licence lost its Reserved Font Name"
          B=public$(grep -oE '/css/tufte-hugo[^" >]*\.css' "$L" | head -1)
          [ -f "$B" ] || fail "missing $B"
          for fam in 'source serif 4' 'source sans 3' 'source code pro' 'tufte serif4 osf digits'; do
            grep -qi "font-family: *\"\\?$fam" "$B" || fail "no $fam @font-face in $B"
          done
          grep -q 'url(\.\./source/SourceSerif4-Regular\.woff2)\|url("\.\./source/SourceSerif4-Regular\.woff2")' "$B" || fail "the Source URL is not relative to the bundle in $B"
          grep -q '\.tufte-font-source' "$B" || fail "no Source font variables in $B"
          grep -qi -- '--tufte-mono: *"\?source code pro' "$B" || fail "Source Code Pro is not the default --tufte-mono in $B"

      # Slides (posts/tufte-slides lists the slides output format; README
      # "Slides"): slides.html beside the article, one slide per h2 or ---
      # plus the title slide, no <section> nested in a slide (reveal.js would
      # take it for a vertical slide), reveal.js with the hashes of
      # vendor.toml, the options, the speaker notes, the slides stylesheet
      # without print rules, and the article's link to its slides.
      - name: Check the slides
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import re, sys, json, tomllib, html
          def fail(m):
              print("::error::" + m); sys.exit(1)
          f = "public/posts/tufte-slides/slides.html"
          try:
              h = open(f, encoding="utf-8").read()
          except OSError:
              fail(f"missing {f}")
          a = open("public/posts/tufte-slides/index.html", encoding="utf-8").read()
          if '<a class="post-slides" href="/posts/tufte-slides/slides.html">' not in a:
              fail("the article has no link to its slides")
          if '<aside class="notes">' not in a or "aside.notes" not in open("../assets/css/theme.css").read():
              fail("the article lost its (hidden) speaker notes")
          i = h.index('<div class="slides">'); j = h.index("<script", i)
          body = h[i:j]
          depth = top = 0
          for m in re.finditer(r"<(/?)section\b", body):
              if m.group(1):
                  depth -= 1
              else:
                  if depth:
                      fail(f"{f}: a <section> nested in a slide")
                  top += 1
                  depth += 1
          if top != 7:
              fail(f"{f}: expected 7 slides (title + 6), got {top}")
          if '<section class="tufte-slide-title">' not in body or 'href="/posts/tufte-slides/">' not in body:
              fail(f"{f}: no title slide with the link to the article")
          if body.count('<aside class="notes">') != 2:
              fail(f"{f}: expected 2 speaker notes")
          if re.search(r"<hr\b", body):
              fail(f"{f}: a thematic break left in the slides")
          v = tomllib.load(open("../data/tufte/vendor.toml", "rb"))["reveal"]
          for k in ("css", "js", "notes"):
              tag = f'href="{v[k]["url"]}"' if k == "css" else f'src="{v[k]["url"]}"'
              m = re.search(re.escape(tag) + r' integrity="([^"]+)"', h)
              if not m or html.unescape(m.group(1)) != v[k]["integrity"]:
                  fail(f"{f}: reveal.js {k} missing or its hash differs from vendor.toml")
          m = re.search(r"var options = (\{.*?\});", h)
          if not m:
              fail(f"{f}: no reveal.js options")
          o = json.loads(m.group(1))
          if o.get("transition") != "slide" or o.get("width") != 1024 or o.get("slideNumber") != "c/t":
              fail(f"{f}: options {o} (front matter transition slide over params.slides)")
          if '<link rel="canonical" href="' not in h or not re.search(r'<link rel="canonical" href="[^"]*/posts/tufte-slides/">', h):
              fail(f"{f}: the canonical link is not the article")
          css = re.search(r'href="(/css/tufte-hugo-slides[^"]+\.css)"', h)
          if not css:
              fail(f"{f}: no slides bundle")
          c = open("public" + css.group(1), encoding="utf-8").read()
          if "@media print" in c or "@media print{" in c:
              fail("the slides bundle keeps print-only rules")
          if "tufte-section" not in c:
              fail("the slides bundle does not style tufte-section")
          print(f"slides: {top} slides")
          EOF

      # Site search (params.search, README "Search"): the index (the home
      # page's "searchindex" output), the header box and its settings on every
      # page, the results page; then the same site with search off, and with
      # search on but no index output (the warning tufte-search-output).
      - name: Check the site search
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          python3 - <<'EOF'
          import json, re, sys, glob, tomllib
          def fail(m):
              print("::error::" + m); sys.exit(1)
          idx = json.load(open("public/search-index.json", encoding="utf-8"))
          if not isinstance(idx, list) or len(idx) < 30:
              fail(f"search-index.json: expected 30+ entries, got {len(idx)}")
          urls = [e["url"] for e in idx]
          if len(set(urls)) != len(urls):
              fail("search-index.json: a page is listed twice")
          for e in idx:
              for k in ("title", "url", "where", "date", "sections"):
                  if k not in e:
                      fail(f"search-index.json: {e.get('url')} has no {k}")
              if not e["url"].startswith("/"):
                  fail(f"search-index.json: url {e['url']} is not a RelPermalink")
          for u in ("/search/", "/archives/"):
              if u in urls:
                  fail(f"search-index.json lists {u} (layout search/archive)")
          text = json.dumps(idx, ensure_ascii=False)
          for bad in ('class=\\"katex', "katex-html", "TUFTENEST", "\ue000", "\ue001", "\ue002", "\ue003", "<sup", "sn-end", "tufte-num", "These are speaker notes"):
              if bad in text:
                  fail(f"search-index.json holds {bad!r}")
          th = {e["url"]: e for e in idx}.get("/posts/theorems/")
          if not th:
              fail("search-index.json has no /posts/theorems/")
          if th["where"] != "Posts" or not th["date"]:
              fail(f"/posts/theorems/: where/date {th['where']!r} {th['date']!r}")
          sec = {s["id"]: s for s in th["sections"]}
          g = sec.get("groups")
          if not g or g["heading"] != "Groups":
              fail(f"/posts/theorems/: no section 'groups' headed 'Groups' (ids: {list(sec)})")
          if not re.search(r"Theorem\s1\.2 \(Lagrange\)", g["text"]) or "$H$" not in g["text"]:
              fail("/posts/theorems/#groups: the theorem head or the $TeX$ of its math is missing")
          if not any("Lagrange proved it in 1771" in n for n in g["notes"]):
              fail("/posts/theorems/#groups: the margin note is not in notes")
          if "Lagrange proved it" in g["text"]:
              fail("/posts/theorems/#groups: a margin note left in the text")
          if not any("$$" in s["text"] for s in th["sections"]):
              fail("/posts/theorems/: no display math as $$TeX$$")
          bk = {e["url"]: e for e in idx}.get("/books/sample-book/tufte-book/")
          if not bk or bk["where"] != "A Tufte-Style Book" or bk["date"]:
              fail("/books/sample-book/tufte-book/: where should be the book, without a date")
          vendor = tomllib.load(open("../data/tufte/vendor.toml", "rb"))["fuse"]
          pages = [f for f in glob.glob("public/**/*.html", recursive=True) if not f.endswith(("/print.html", "/slides.html"))]
          for f in pages:
              h = open(f, encoding="utf-8").read()
              if "<html" not in h or 'http-equiv="refresh"' in h:
                  continue
              if h.count('<form class="site-search" role="search"') != 1:
                  fail(f"{f}: expected one header search box")
              if not re.search(r'<form class="site-search" role="search" method="get" action="/search/" data-tufte-search="box" hidden>', h):
                  fail(f"{f}: the search box is not hidden, or has no action /search/")
              m = re.search(r'<script type="application/json" id="tufte-search-config">(.*?)</script>', h)
              if not m:
                  fail(f"{f}: no search settings")
              cfg = json.loads(m.group(1))
              if cfg["index"] != "/search-index.json" or cfg["page"] != "/search/":
                  fail(f"{f}: index {cfg['index']} page {cfg['page']}")
              if cfg["fuse"] != vendor["url"] or cfg["fuseIntegrity"] != vendor["integrity"]:
                  fail(f"{f}: Fuse.js URL or hash differs from vendor.toml")
              if not re.search(r'<script src="/tufte/search(?:\.min)?\.[0-9a-f]+\.js" integrity="sha256-[^"]+" crossorigin="anonymous" defer></script>', h):
                  fail(f"{f}: no search script with SRI")
          sp = open("public/search/index.html", encoding="utf-8").read()
          if 'data-tufte-search="page"' not in sp or '<ol class="search-results"></ol>' not in sp:
              fail("public/search/index.html: no results form or list")
          print(f"search: {len(idx)} entries, {len(pages)} pages checked")
          EOF

          HUGO_PARAMS_SEARCH_ENABLE=false hugo --gc --panicOnWarning -d "$RUNNER_TEMP/nosearch"
          N="$RUNNER_TEMP/nosearch"
          if grep -lE 'site-search|tufte-search-config|/tufte/search\.' "$N/index.html" "$N/posts/theorems/index.html"; then
            fail "search.enable = false still shows the search box or loads its script"
          fi
          grep -q 'Search is not enabled on this site.' "$N/search/index.html" || fail "search page without the search-off line"

          out=$(HUGO_OUTPUTS_HOME=html hugo --gc -d "$RUNNER_TEMP/noindex" 2>&1) || fail "build without the index output failed: $out"
          grep -q 'tufte-search-output' <<< "$out" || fail "no tufte-search-output warning without the index output: $out"
          [ ! -e "$RUNNER_TEMP/noindex/search-index.json" ] || fail "search-index.json written without the output"
          if grep -q 'site-search' "$RUNNER_TEMP/noindex/index.html"; then fail "search box shown without an index"; fi

      # Exercises the other code paths: HTML minification, no sectioning and
      # Goldmark endnotes (pages may still override both in front matter).
      - name: Build (minified, sections = none, footnotes = endnotes)
        env:
          HUGO_PARAMS_SECTIONS: none
          HUGO_PARAMS_FOOTNOTES: endnotes
        run: hugo --gc --minify --panicOnWarning --destination public-variant

      # SPEC-LATEX §11: sidenotes and real footnotes on the same page.
      # footnotes-as-sidenotes mixes [^x], [^fn-x], {{< footnote >}} and
      # {{< sidenote >}} (footnote list at the end of the page);
      # footnotes-and-sidenotes does the same with footnoteplacement: section.
      - name: Check footnotes and sidenotes together
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          need() { [ -f "$1" ] || fail "missing $1"; }
          # Every in-page footnote link has its target, in both directions.
          links() {
            local f=$1 h
            for h in $(grep -o 'href="#fn\(ref\)\?-[^"]*"' "$f" | sed 's/^href="#//; s/"$//' | sort -u); do
              grep -q " id=\"$h\"" "$f" || fail "dangling footnote link #$h in $f"
            done
          }
          nodups() {
            local dups
            dups=$(grep -o ' id="[^"]*"' "$1" | sort | uniq -d || true)
            [ -z "$dups" ] || fail "duplicate ids in $1: $dups"
          }
          common() {
            local f=$1
            need "$f"
            grep -q 'class="margin-toggle sidenote-number"' "$f" || fail "no sidenote in $f"
            grep -q '<sup class="footnote-ref" id="fnref-' "$f" || fail "no footnote reference in $f"
            grep -q 'class="footnotes-list"' "$f" || fail "no footnote list in $f"
            grep -q '<li id="fn-[^"]*" class="footnote-item"' "$f" || fail "no footnote item in $f"
            grep -q 'class="footnote-backref"' "$f" || fail "no footnote backlink in $f"
            # The page has numbered sidenotes, so footnotestyle "auto" uses letters.
            grep -q 'role="doc-noteref">a</a></sup>' "$f" || fail "first footnote is not marked \"a\" in $f"
            if grep -q '<div class="footnotes"' "$f"; then fail "Goldmark footnote div left in $f"; fi
            if grep -q 'href="#fn:' "$f"; then fail "Goldmark footnote link left in $f"; fi
            if grep -q 'class="tufte-fn"' "$f"; then fail "unresolved footnote marker in $f"; fi
            links "$f"
            nodups "$f"
          }

          P=public/posts/footnotes-as-sidenotes/index.html
          common "$P"
          [ "$(grep -o 'class="footnotes-list"' "$P" | wc -l)" -eq 1 ] || fail "footnoteplacement page: expected one footnote list in $P"
          # <section class="footnotes footnotes-STYLE" …> (STYLE: arabic, alpha, roman, symbol)
          grep -qE '<section class="footnotes( [^"]*)?" role="doc-endnotes"' "$P" || fail "no section.footnotes in $P"

          S=public/posts/footnotes-and-sidenotes/index.html
          common "$S"
          [ "$(grep -o 'class="footnotes-list"' "$S" | wc -l)" -ge 2 ] || fail "footnoteplacement section: expected a footnote list per section in $S"
          grep -q '<div class="footnotes footnotes-section' "$S" || fail "footnoteplacement section: no div.footnotes.footnotes-section in $S"

          # Summaries on list pages: no footnote link without its target.
          for f in public/index.html public/posts/index.html; do
            need "$f"; links "$f"; nodups "$f"
          done

      - name: Check footnotes and sidenotes (sections = none, footnotes = endnotes)
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          # This build is minified: attribute quotes may be dropped.
          for f in public-variant/posts/footnotes-as-sidenotes/index.html public-variant/posts/footnotes-and-sidenotes/index.html; do
            [ -f "$f" ] || fail "missing $f"
            # endnotes mode: [^x] are real footnotes, the shortcodes keep their kind.
            grep -q 'class="margin-toggle sidenote-number' "$f" || fail "sidenote shortcode lost in $f"
            grep -qE 'class="?footnotes-list' "$f" || fail "no footnote list in $f"
            if grep -qE 'href="?#fn:' "$f"; then fail "Goldmark footnote link left in $f"; fi
            for h in $(grep -oE 'href="?#fn(ref)?-[^" >]*' "$f" | sed -E 's/^href="?#//' | sort -u); do
              grep -qE " id=\"?$h(\"|[ >])" "$f" || fail "dangling footnote link #$h in $f"
            done
            dups=$(grep -oE ' id="?[^" >]*' "$f" | sed 's/"//' | sort | uniq -d || true)
            [ -z "$dups" ] || fail "duplicate ids in $f: $dups"
          done

      # tufte-latex parity (SPEC-LATEX §10): the acceptance matrix, run on the
      # default build. The script is written once and reused by the variant
      # builds below ("markers" mode: only unresolved markers and duplicate ids,
      # since a variant legitimately changes numbering and layout).
      - name: Write the tufte-latex acceptance script
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/tufte-latex-check.sh" <<'TUFTE_LATEX_CHECK'
          #!/usr/bin/env bash
          # tufte-latex acceptance matrix (SPEC-LATEX §10), run inside the public dir.
          set -uo pipefail
          cd "${1:-public}"
          mode=${2:-full}   # full: the default build; markers: only markers and ids (variant builds)
          errs=0
          fail() { echo "::error::$*"; errs=$((errs+1)); }
          need() { [ -f "$1" ] || { fail "missing $1"; return 1; }; }

          # 1. No unresolved markers anywhere.
          for pat in 'TUFTENEST' 'raw HTML omitted' 'class="sn-end"' 'class="cap-end"' 'class="tufte-float"' 'class="tufte-block' 'TUFTEBLOCK' 'TUFTEFIGURE' 'TUFTEXREF' '&lt;a class=&#34;xref' 'class="xref xref-missing"' '<span class="tufte-num"[^>]*></span>' 'class="tufte-placeholder"' 'class="bib-entry bib-missing"'; do
            hits=$(grep -rlE --include='*.html' "$pat" . || true)
            [ -z "$hits" ] || fail "unresolved marker /$pat/ in: $(echo $hits)"
          done

          # 2. Unique ids in every HTML page (including the book's print.html).
          while IFS= read -r f; do
            dups=$(grep -oE ' id="[^"]*"' "$f" | sort | uniq -d || true)
            [ -z "$dups" ] || fail "duplicate ids in $f: $(echo $dups)"
          done < <(find . -name '*.html' -not -path './tags/*' -not -path './categories/*')

          if [ "$mode" = markers ]; then
            [ "$errs" -eq 0 ] && echo "tufte-latex markers: all checks passed" && exit 0
            echo "$errs check(s) failed"; exit 1
          fi

          # 3. Tufte CSS showcase stays unnumbered (R12): no labels, no xrefs there.
          T=posts/tufte-css/index.html
          need "$T" && { grep -q 'class="caption-label"' "$T" && fail "$T: figures numbered in the Tufte CSS port"; }

          # 4. Handout: figures 1, 2, 3 and table 1; automatic bibliography; LaTeX title block.
          H=posts/sample-handout/index.html
          if need "$H"; then
            nums=$(grep -oE 'data-kind="(figure|table)"[^>]*>[0-9]+<' "$H" | sed -E 's/data-kind="([a-z]+)".*>([0-9]+)</\1\2/' | tr '\n' ' ')
            [ "$nums" = "figure1 figure2 figure3 table1 " ] || fail "$H: float numbers are '$nums'"
            grep -q '<h2 id="tufte-references">' "$H" || fail "$H: no automatic bibliography"
            grep -q 'class="sidenote citation"' "$H" || fail "$H: no citation sidenote"
            grep -q 'tufte-handout' "$H" || fail "$H: body class tufte-handout missing"
            grep -q 'title-block latex' "$H" || fail "$H: no LaTeX title block"
          fi

          # 5. Book: landing, print view, continuous numbering, cross-chapter xrefs, index.
          BK=books/sample-book
          for f in index.html index.xml print.html tufte-design/index.html tufte-book/index.html introduction/index.html troubleshooting/index.html general-index/index.html bibliography/index.html figures/index.html tables/index.html; do need "$BK/$f"; done
          need books/parts-demo/index.xml
          grep -q 'class="book-toc"' "$BK/index.html" || fail "$BK: no table of contents on the landing page"
          grep -q 'class="title-page"' "$BK/index.html" || fail "$BK: no title page"
          grep -q 'tufte-book' "$BK/tufte-book/index.html" || fail "$BK: body class tufte-book missing"
          # sidenote counter-reset grows monotonically along the chapters
          prev=-1
          for c in tufte-design tufte-book customizing compatibility troubleshooting; do
            n=$(grep -oE 'counter-reset: ?sidenote-counter [0-9]+' "$BK/$c/index.html" | grep -oE '[0-9]+$' || echo 0)
            [ "$n" -ge "$prev" ] || fail "$BK/$c: sidenote counter-reset $n < $prev"
            prev=$n
          done
          # tables continue across chapters: tufte-book's first numbered table follows tufte-design's last
          last1=$(grep -oE 'data-kind="table"[^>]*>[0-9]+<' "$BK/tufte-design/index.html" | grep -oE '>[0-9]+<' | tr -d '<>' | tail -1)
          first2=$(grep -oE 'data-kind="table"[^>]*>[0-9]+<' "$BK/tufte-book/index.html" | grep -oE '>[0-9]+<' | tr -d '<>' | head -1)
          [ -n "$last1" ] && [ -n "$first2" ] && [ "$first2" -eq $((last1+1)) ] || fail "$BK: tables do not continue across chapters ($last1 → $first2)"
          # cross-chapter references, forward (introduction → tufte-book) and backward (troubleshooting → tufte-book)
          grep -q 'class="xref" href="/books/sample-book/tufte-book/' "$BK/introduction/index.html" || fail "$BK: no forward cross-chapter xref"
          grep -q 'class="xref" href="/books/sample-book/tufte-book/#fig-marginfig"' "$BK/troubleshooting/index.html" || fail "$BK: no backward cross-chapter xref"
          # footnotemark inside {{< table >}} and its lone footnotetext
          grep -qE '<label for="sn-[0-9a-f]+-ft-frontispiece"' "$BK/tufte-design/index.html" || fail "$BK: footnotemark missing"
          grep -q 'class="footnotetext-anchor"' "$BK/tufte-design/index.html" || fail "$BK: footnotetext missing"
          grep -q '<p><p class="footnotetext-anchor"' "$BK/tufte-design/index.html" && fail "$BK: footnotetext wrapped in <p>"
          # lists, bibliography, index
          grep -q 'class="tufte-lof"' "$BK/figures/index.html" || fail "$BK: empty list of figures"
          grep -q 'class="tufte-lof"' "$BK/tables/index.html" || fail "$BK: empty list of tables"
          grep -q 'class="bibliography-list"' "$BK/bibliography/index.html" || fail "$BK: no bibliography list"
          grep -q 'fonts, <em>see</em> typefaces' "$BK/general-index/index.html" || fail "$BK: index lacks 'fonts, see typefaces'"

          # 6. camelCase options take effect: numberChapters in the parts demo.
          PD=books/parts-demo
          if [ -d "$PD" ]; then
            grep -rqE 'class="chapter-number"' "$PD" || fail "$PD: numberChapters = true did not number the chapters"
            grep -rq 'class="part-number"' "$PD" || fail "$PD: no part numbers"
            # a .bib page resource of the book bundle (bibliography: refs.bib), read by the BibTeX reader
            grep -q 'id="ref-knuth1984"' "$PD/bibliography/index.html" || fail "$PD: refs.bib entries missing from the bibliography"
            # book root `frontispiece`: an unnumbered figure before the title page
            grep -q '<section class="frontispiece"><figure class="tufte-figure">' "$PD/index.html" || fail "$PD: no frontispiece on the landing page"
            # a label outside a numbered section of a numbered appendix gives the appendix letter (\label after \chapter)
            grep -qE 'class="xref"[^>]*>Appendix&nbsp;A<' "$PD/notation/index.html" || fail "$PD: label in appendix A does not refer to the appendix"
          fi

          # 7. Cheat-sheet page: nested shortcodes in a sidenote, every placeholder resolved.
          L=posts/latex-to-hugo/index.html
          if need "$L"; then
            grep -oE '<span class="sidenote"[^>]*>.*' "$L" | grep -q 'class="smallcaps"' || fail "$L: smallcaps inside a sidenote not rendered"
            grep -q 'href="#sn-demo">Note' "$L" || fail "$L: labelled sidenote not referenced"
            grep -q 'class="tufte-index' "$L" || fail "$L: no index"
            grep -q '<sup class="footnote-ref" id="fnref-' "$L" || fail "$L: no real footnote (footnote shortcode, [^fn-x])"
            grep -q 'data-kind="listing"><li>' "$L" || fail "$L: no list of listings"
          fi
          # a summary with a forward xref resolves on the list page (whichever
          # pager of posts/ shows it)
          grep -qE 'class="xref"[^>]*>The cheat sheet<' posts/index.html posts/page/*/index.html || fail "posts/: forward xref in the latex-to-hugo summary not resolved"

          # 8. Theorems (amsthm): numbers within sections and on a counter of
          # their own, cross-references, proof heads, end-of-proof symbols and
          # the list of theorems (posts/theorems); theorems numbered within the
          # chapters of the parts demo, across chapters and in print.html.
          TH=posts/theorems/index.html
          if need "$TH"; then
            nums=$(grep -oE '<span class="tufte-num" data-kind="thm" data-key="[^"]*">[^<]+</span>' "$TH" | sed -E 's/.*">([^<]+)<\/span>$/\1/' | tr '\n' ' ')
            [ "$nums" = "1.1 1.2 1.3 1 2.1 2.2 2.3 2 2.4 " ] || fail "$TH: theorem numbers are '$nums'"
            grep -q 'class="xref" href="#thm-lagrange">Theorem&nbsp;1.2<' "$TH" || fail "$TH: no full xref to Theorem 1.2"
            grep -q 'class="xref" href="#thm-lagrange">Lagrange</a>' "$TH" || fail "$TH: no name xref (the note) to Theorem 1.2"
            grep -q 'class="xref" href="#lem-coset">1.3<' "$TH" || fail "$TH: no number xref to Lemma 1.3"
            grep -q 'class="xref" href="#rem-u">Remark<' "$TH" || fail "$TH: no xref to the unnumbered remark"
            grep -q 'class="xref" href="#cor-unit">Corollary&nbsp;2.3<' "$TH" || fail "$TH: no full xref to Corollary 2.3"
            # the other xref formats (num, eq, page) and a labelled proof's head
            [ "$(grep -o 'class="xref" href="#lem-coset">1.3</a>' "$TH" | wc -l)" -ge 2 ] || fail "$TH: no num xref to Lemma 1.3 (besides the default one)"
            grep -q 'class="xref" href="#lem-coset">(1.3)</a>' "$TH" || fail "$TH: no eq xref to Lemma 1.3"
            grep -q 'class="xref" href="#lem-coset">Groups</a>' "$TH" || fail "$TH: no page xref to Lemma 1.3 (its section)"
            grep -q 'class="xref" href="#prf-lagrange">Proof of Theorem' "$TH" || fail "$TH: no xref to the labelled proof of Theorem 1.2"
            # a proposition (title=, numbered=false, style=, class=), a kind
            # declared in the front matter (principle), an example with qed=,
            # a list of the conjectures only (kinds=, heading=)
            grep -q '<section class="tufte-thm thm-definition thm-kind-proposition thm-look-tufte fullwidth" id="[^"]*" data-thm="proposition" data-counter="" data-within="">' "$TH" || fail "$TH: no unnumbered fullwidth proposition in the definition style"
            grep -q '<span class="thm-note-text">Cayley</span>' "$TH" || fail "$TH: the proposition's title= is not its note"
            grep -q '<section class="tufte-thm thm-definition thm-kind-principle thm-look-tufte" id="[^"]*" data-thm="principle" data-counter="" data-within=""><p><span class="thm-head"><span class="thm-name">Principle</span>' "$TH" || fail "$TH: the principle kind declared in the front matter is not used"
            [ "$(tr -d '\n' < "$TH" | grep -cE 'data-thm="example"[^>]*>.*<span class="thm-qed thm-qed-text" role="img" aria-label="[^"]*">◇</span></p></section>')" -gt 0 ] || fail "$TH: the example has no qed= symbol at its end"
            grep -q '<h2 id="tufte-list-of-theorems-2">Conjectures</h2><ol class="tufte-lof" data-kind="thm"><li>' "$TH" || fail "$TH: no list of the conjectures (kinds=, heading=)"
            [ "$(tr -d '\n' < "$TH" | grep -oE '<h2 id="tufte-list-of-theorems-2">.*' | sed 's#</ol>.*##' | grep -o '<li>' | wc -l)" -eq 2 ] || fail "$TH: the list of conjectures does not have its 2 entries"
            grep -q 'Proof of <a class="xref" href="#thm-lagrange">Theorem&nbsp;1.2</a>' "$TH" || fail "$TH: no head 'Proof of Theorem 1.2'"
            grep -q '<section class="tufte-thm thm-remark thm-kind-remark thm-look-tufte" id="rem-u" data-thm="remark" data-counter="" data-within="">' "$TH" || fail "$TH: the unnumbered remark is not an unnumbered theorem section"
            [ "$(tr -d '\n' < "$TH" | sed -E 's/.*id="rem-u"[^>]*>//; s#</section>.*##' | grep -c 'class="thm-num"')" -eq 0 ] || fail "$TH: the unnumbered remark has a number"
            grep -q '<p class="thm-qed-line">' "$TH" || fail "$TH: no end-of-proof symbol on a line of its own"
            # A proof that ends with a paragraph ends it with its symbol, at the
            # end of its last line (the proof of Lagrange's theorem, and the one of
            # the lemma inside a proof).
            [ "$(tr -d '\n' < "$TH" | grep -oE ' <span class="thm-qed thm-qed-[a-z]+" role="img" aria-label="[^"]*">[^<]*</span></p></section>' | wc -l)" -ge 2 ] || fail "$TH: no end-of-proof symbol inline at the end of a proof's last paragraph"
            # \qedhere in a display: the claimed symbol is the last child of the
            # display span. (grep -c reads all its input: with grep -q, tr could
            # die of SIGPIPE and pipefail would fail the test.)
            [ "$(tr -d '\n' < "$TH" | grep -cE '</span><span class="thm-qed thm-qed-[a-z]+" role="img" aria-label="[^"]*" data-qedhere="2">[^<]*</span></span>')" -gt 0 ] || fail "$TH: no \\qedhere symbol at the end of a display"
            grep -q 'data-qedhere="1"' "$TH" && fail "$TH: a \\qedhere symbol was not claimed by its proof"
            # in a numbered display it follows the equation number
            grep -q 'data-key="eq-coset" data-labeled="1">1</span>)</span><span class="thm-qed thm-qed-[a-z]*" role="img" aria-label="[^"]*" data-qedhere="2">' "$TH" || fail "$TH: the \\qedhere symbol of a numbered display is not after its number"
            proofs=$(grep -oE '<(section|span data-sn="section") class="tufte-proof[ "]' "$TH" | wc -l)
            qeds=$(grep -oE 'class="thm-qed[ "]' "$TH" | wc -l)
            # (one more: the example's qed= symbol)
            [ "$proofs" -ge 5 ] && [ "$(( proofs + 1 ))" -eq "$qeds" ] || fail "$TH: $proofs proofs but $qeds end-of-proof symbols"
            grep -q 'id="tufte-list-of-theorems"' "$TH" || fail "$TH: no list of theorems heading"
            thms=$(grep -oE '<(section|span data-sn="section") class="tufte-thm[ "]' "$TH" | wc -l)
            items=$(tr -d '\n' < "$TH" | grep -oE '<ol class="tufte-lof" data-kind="thm">.*' | sed 's#</ol>.*##' | grep -o '<li>' | wc -l)
            [ "$thms" -ge 10 ] && [ "$items" -eq "$thms" ] || fail "$TH: the list of theorems has $items entries for $thms theorems"
            grep -q 'thm-look-tufte' "$TH" || fail "$TH: no tufte look"
            # Every in-page link has its target (theorem ids, labels, notes;
            # a TOC link escapes the colon of an explicit id).
            for h in $(grep -o 'href="#[^"]*"' "$TH" | sed 's/^href="#//; s/"$//; s/%3[aA]/:/g' | sort -u); do
              grep -q " id=\"$h\"" "$TH" || fail "$TH: dangling link #$h"
            done
            # The exact head of Theorem 1.2: plain style, number, note, punctuation.
            grep -q '<section class="tufte-thm thm-plain thm-kind-theorem thm-look-tufte" id="thm-lagrange" data-thm="theorem" data-counter="theorem" data-within="section"><p><span class="thm-head"><span class="thm-name">Theorem</span>&nbsp;<span class="thm-num"><span class="tufte-num" data-kind="thm" data-key="thm-lagrange">1.2</span></span> <span class="thm-note">(<span class="thm-note-text">Lagrange</span>)</span><span class="thm-punct">.</span></span> If ' "$TH" || fail "$TH: the head of Theorem 1.2 is not the documented markup"
            [ "$(grep -o 'class="tufte-thm thm-plain ' "$TH" | wc -l)" -ge 6 ] || fail "$TH: fewer than 6 theorems in the plain style"
            grep -q 'class="tufte-thm thm-remark ' "$TH" || fail "$TH: no theorem in the remark style"
            heads=$(grep -o '<span class="thm-head">' "$TH" | wc -l)
            [ "$heads" -eq "$(grep -o '<span class="thm-punct">' "$TH" | wc -l)" ] || fail "$TH: a head without its thm-punct span"
            [ "$(grep -o '<span class="thm-punct">\.</span></span>' "$TH" | wc -l)" -ge "$(( heads - 1 ))" ] || fail "$TH: heads without their period"
            [ "$(grep -o '<span class="thm-note">' "$TH" | wc -l)" -eq "$(grep -o '<span class="thm-note">(<span class="thm-note-text">' "$TH" | wc -l)" ] || fail "$TH: a note without its parentheses"
            [ "$(grep -o '<span class="thm-note-text">[^<]*</span>)</span><span class="thm-punct">' "$TH" | wc -l)" -ge 4 ] || fail "$TH: notes not closed before the punctuation"
            grep -q '<span class="lof-num">Theorem&nbsp;1.2</span> Lagrange</a>' "$TH" || fail "$TH: no list-of-theorems entry 'Theorem 1.2 Lagrange'"
            [ "$(grep -o '<span class="lof-num"></span>' "$TH" | wc -l)" -eq 0 ] || fail "$TH: an empty number in the list of theorems"
            # A theorem in a sidenote is set inline: a span, never a block.
            grep -q '<span class="sidenote"><span data-sn="section" class="tufte-thm ' "$TH" || fail "$TH: the theorem in a sidenote is not set inline"
            ! grep -qE '<span class="(sidenote|marginnote)">(<label[^>]*>[^<]*</label><input[^>]*>)?<(section|p|div)[ >]' "$TH" || fail "$TH: a block element opens a note"
            # A label in a theorem's body refers to the theorem (\begin{conjecture}\label{…}).
            grep -q 'class="xref" href="#conj-goldbach">Conjecture&nbsp;1<' "$TH" || fail "$TH: the label in the conjecture's body does not refer to Conjecture 1"
            # Margin material at the start of a theorem and at the end of a
            # proof: the head still runs in, the QED still ends the last line.
            dg=$(tr -d '\n' < "$TH" | sed -E 's/.*id="def-group"[^>]*>//; s#</section>.*##')
            case "$dg" in '<label for="'*'<span class="marginnote">'*'</span><p><span class="thm-head"><span class="thm-name">Definition</span>'*) ;; *) fail "$TH: the head of Definition 1.1 does not run in past its margin note";; esac
            pl=$(tr -d '\n' < "$TH" | sed -E 's/.*id="prf-lagrange"[^>]*>//; s#</section>.*##')
            case "$pl" in *'aria-label="End of proof">■</span></p><label for="'*'<span class="marginnote">'*) ;; *) fail "$TH: the QED of the proof of Theorem 1.2 does not end its last line before the margin note";; esac
          fi
          if [ -d "$PD" ]; then
            grep -q 'data-kind="thm" data-key="thm-margin-width">1\.1<' "$PD/part-one/margins/index.html" || fail "$PD: Theorem 1.1 not numbered within chapter 1"
            grep -q 'data-kind="thm" data-key="lem-half-width">1\.2<' "$PD/part-one/margins/index.html" || fail "$PD: Lemma 1.2 not on the shared counter"
            grep -qE 'data-kind="thm" data-key="[^"]*">2\.1<' "$PD/part-two/graphs/index.html" || fail "$PD: Theorem 2.1 not numbered within chapter 2"
            grep -q 'data-kind="thm" data-key="def-notation">A\.1<' "$PD/notation/index.html" || fail "$PD: Definition A.1 not numbered within appendix A"
            grep -q 'class="xref" href="/books/parts-demo/part-one/margins/#thm-margin-width">Theorem&nbsp;1\.1<' "$PD/part-two/graphs/index.html" || fail "$PD: no cross-chapter xref to Theorem 1.1"
            grep -qE ' id="tufte-c[0-9]+-thm-margin-width"' "$PD/print.html" || fail "$PD/print.html: no print id of Theorem 1.1"
            grep -qE 'href="#tufte-c[0-9]+-thm-margin-width"' "$PD/print.html" || fail "$PD/print.html: the cross-chapter theorem xref is not an in-document link"
          fi

          [ "$errs" -eq 0 ] && echo "tufte-latex acceptance: all checks passed" || { echo "$errs check(s) failed"; exit 1; }
          TUFTE_LATEX_CHECK
          chmod +x "$RUNNER_TEMP/tufte-latex-check.sh"

      - name: Check tufte-latex parity (handout, book, cheat sheet)
        shell: bash
        run: '"$RUNNER_TEMP/tufte-latex-check.sh" public full'

      # The LaTeX preset everywhere (justified off, hyphenation, indentation,
      # old-style figures, numbered floats, plainnat, running heads). Not
      # minified, so that the marker checks can match quoted attributes.
      - name: Build (tufte.style = latex)
        env:
          HUGO_PARAMS_TUFTE_STYLE: latex
          HUGO_PARAMS_FONT: libertinus
        run: hugo --gc --panicOnWarning --destination public-latex

      - name: Check tufte-latex markers (tufte.style = latex)
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/tufte-latex-check.sh" public-latex markers
          grep -q 'tufte-style-latex' public-latex/posts/tufte-css/index.html || { echo "::error::style preset not applied"; exit 1; }
          # The LaTeX preset gives theorems amsthm's bold heads and open box.
          TH=public-latex/posts/theorems/index.html
          grep -q 'thm-look-amsthm' "$TH" || { echo "::error::no amsthm look in $TH"; exit 1; }
          grep -q 'class="thm-qed thm-qed-openbox"' "$TH" || { echo "::error::no open-box end-of-proof symbol in $TH"; exit 1; }
          # This build also sets params.font = "libertinus": every page, and
          # the running heads (custom properties do not reach @page boxes).
          grep -q 'class="tufte-font-libertinus"' public-latex/posts/tufte-css/index.html || { echo "::error::params.font = libertinus not applied"; exit 1; }
          grep -q '@top-right{content:[^}]*font-family:"Libertinus Serif"' public-latex/posts/sample-handout/index.html || { echo "::error::the running heads are not in Libertinus Serif"; exit 1; }

      # KaTeX in the browser: the TeX stays in the HTML and the page loads
      # katex.min.js and auto-render of the same release as the stylesheet.
      - name: Build (math.engine = client)
        env:
          HUGO_PARAMS_MATH_ENGINE: client
        run: hugo --gc --panicOnWarning --destination public-client

      - name: Check KaTeX in the browser (math.engine = client)
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          "$RUNNER_TEMP/tufte-latex-check.sh" public-client markers
          M=public-client/posts/math-and-code/index.html
          [ -f "$M" ] || fail "missing $M"
          grep -q 'class="math math-inline"' "$M" || fail "no client-side math in $M"
          css=$(grep -oE 'katex@[0-9.]+/dist/katex\.min\.css' "$M" | head -1 | cut -d/ -f1)
          js=$(grep -oE 'katex@[0-9.]+/dist/katex\.min\.js' "$M" | head -1 | cut -d/ -f1)
          [ -n "$css" ] && [ "$css" = "$js" ] || fail "KaTeX stylesheet ($css) and script ($js) differ in $M"
          # \qedhere in a display: removed from the TeX that KaTeX reads, its
          # symbol the last child of the display span.
          TH=public-client/posts/theorems/index.html
          [ -f "$TH" ] || fail "missing $TH"
          [ "$(tr -d '\n' < "$TH" | grep -cE 'class="math math-display">[^<]*<span class="thm-qed thm-qed-[a-z]+" role="img" aria-label="[^"]*" data-qedhere="2">[^<]*</span></span>')" -gt 0 ] || fail "no \\qedhere symbol inside a client-side display in $TH"
          if [ "$(tr -d '\n' < "$TH" | grep -oE 'class="math math-display">[^<]*' | grep -c 'qedhere')" -gt 0 ]; then fail "\\qedhere left in the TeX of a display in $TH"; fi
          # a numbered display keeps the symbol out of the TeX span, after the
          # number, as the server engine does
          grep -q 'data-key="eq-coset" data-labeled="1">1</span>)</span><span class="thm-qed thm-qed-[a-z]*" role="img" aria-label="[^"]*" data-qedhere="2">' "$TH" || fail "the \\qedhere symbol of a numbered client-side display is not after its number in $TH"
          # Book landings have no pager: no /page/N/ copies of print.html.
          if find public-client -path '*/page/*' -name print.html | grep -q .; then fail "paginated copies of print.html"; fi
          # Euler math: KaTeX writes MathML for the spans that ask for it.
          grep -q 'class="math math-inline" data-output="mathml"' public-client/posts/euler-math/index.html || fail "no data-output=mathml in posts/euler-math (client)"
          if grep -q 'data-output="mathml"' "$M"; then fail "data-output=mathml in $M (font katex)"; fi
          grep -q 'function mathmlCore' public-client/posts/euler-math/index.html || fail "no MathML fixes in the client script"
          grep -q 'class="math math-inline" data-output="mathml" data-mathfont="libertinus"' public-client/posts/libertinus/index.html || fail "no data-mathfont=libertinus in posts/libertinus (client)"
          grep -q '<span class="tufte-nobr"><span class="math math-inline" data-output="mathml"' public-client/posts/libertinus/index.html || fail "no tufte-nobr around client MathML in posts/libertinus"

      # The whole site in Euler (params.math.font = "euler", with fleqn and
      # leqno): every page still passes the marker checks, and no page holds
      # KaTeX's HTML.
      - name: Build (math.font = euler)
        env:
          HUGO_PARAMS_MATH_FONT: euler
          HUGO_PARAMS_MATH_FLEQN: "true"
          HUGO_PARAMS_MATH_LEQNO: "true"
        run: hugo --gc --panicOnWarning --destination public-euler

      - name: Check Euler math everywhere (math.font = euler)
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          "$RUNNER_TEMP/tufte-latex-check.sh" public-euler markers
          if grep -rl 'katex-html' public-euler --include='*.html' | grep -q .; then fail "KaTeX HTML with math.font = euler: $(grep -rl 'katex-html' public-euler --include='*.html' | head -3)"; fi
          M=public-euler/posts/math-and-code/index.html
          grep -q '<span class="katex tufte-math-euler"><span class="katex-mathml"><math' "$M" || fail "no MathML in $M"
          grep -q 'class="math-display tagged numbered leqno" id="eq-euler-tag">' "$M" || fail "the labelled \\tag display of $M is not the theme's (leqno)"
          grep -q '<span class="katex-display fleqn leqno">' "$M" || fail "no fleqn/leqno display wrapper in $M"
          grep -q '<span class="eq-number">(A.1)</span>' "$M" || fail "no (A.1) tag in $M"
          grep -q 'href="#eq-euler-tag">(A.1)</a>' "$M" || fail "eqref to the \\tag display is not (A.1) in $M"
          TH=public-euler/posts/theorems/index.html
          grep -q 'data-qedhere="2"' "$TH" || fail "no claimed \\qedhere symbol in $TH"

      - name: Build (A4 paper, nobib, numbered sections)
        env:
          HUGO_PARAMS_TUFTE_PRINT_PAPER: a4
          HUGO_PARAMS_TUFTE_BIBLIOGRAPHY_MARGIN: "false"
          HUGO_PARAMS_TUFTE_HEADINGS_NUMBER: "2"
        run: hugo --gc --panicOnWarning --destination public-a4

      - name: Check tufte-latex markers (A4 paper, nobib, numbered sections)
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/tufte-latex-check.sh" public-a4 markers
          # The theorems page sets its own headings.number: its numbers stay.
          TH=public-a4/posts/theorems/index.html
          nums=$(grep -oE '<span class="tufte-num" data-kind="thm" data-key="[^"]*">[^<]+</span>' "$TH" | sed -E 's/.*">([^<]+)<\/span>$/\1/' | tr '\n' ' ')
          [ "$nums" = "1.1 1.2 1.3 1 2.1 2.2 2.3 2 2.4 " ] || { echo "::error::theorem numbers in $TH are '$nums'"; exit 1; }

      # uglyURLs: Hugo writes a section's page as books/b/index.html, but
      # still names some list pages x.html (taxonomy terms); without noUgly
      # on the print format, a print output would go to that same file and
      # replace the HTML page, with no warning.
      - name: Build (uglyURLs)
        env:
          HUGO_UGLYURLS: "true"
        run: hugo --gc --panicOnWarning --destination public-ugly

      - name: Check the book landing and print.html (uglyURLs)
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          for b in sample-book parts-demo; do
            P=public-ugly/books/$b/print.html
            [ -f "$P" ] || fail "missing $P"
            grep -q '<body class="[^"]*tufte-print-book' "$P" || fail "$P is not the print document"
            L=public-ugly/books/$b/index.html
            [ -f "$L" ] || fail "no landing for books/$b ($L)"
            grep -q '<body class="tufte-book' "$L" || fail "$L is not the book landing"
            ! grep -q '<body class="[^"]*tufte-print-book' "$L" || fail "$L is the print document, not the landing"
          done

      # Scale regression: a generated 200-chapter book (html + print), each
      # chapter with sidenotes, cross-chapter xrefs, labelled figures, cites,
      # a theorem and index entries. The theme memoizes its cross-page results in
      # .Store; when they sat only in partialCached's bounded cache, such a
      # book took minutes instead of seconds. From about 160 chapters up,
      # partialCached also evicts its own entries during the build: the
      # memos must stay valid then (tufte/build-stamp.html), which the
      # execution count of func/content-raw.html checks (about 16 per
      # chapter when they do, more than 35 when every eviction recomputes
      # them).
      - name: Build a 200-chapter book within the time limit
        shell: bash
        run: |
          set -euo pipefail
          B="$RUNNER_TEMP/bigbook"
          mkdir -p "$B/content/books/big" "$B/data"
          cp data/bibliography.yaml "$B/data/"
          cat > "$B/hugo.toml" <<EOF
          baseURL = "https://example.org/"
          title = "Big book"
          theme = "tufte.hugo"
          themesDir = "$GITHUB_WORKSPACE"
          [markup.goldmark.parser]
            wrapStandAloneImageWithinParagraph = false
            [markup.goldmark.parser.attribute]
              block = true
          [markup.goldmark.extensions.passthrough]
            enable = true
            [markup.goldmark.extensions.passthrough.delimiters]
              inline = [['\$', '\$']]
              block = [['\$\$', '\$\$']]
          EOF
          N=200
          printf -- '---\ntitle: Big\nbook: true\noutputs: [html, print]\n---\n' > "$B/content/books/big/_index.md"
          for i in $(seq 1 "$N"); do
            p=$(( i > 1 ? i - 1 : 1 ))
            f="$B/content/books/big/ch$(printf %03d "$i").md"
            # Each chapter brings its own `references` (the book-wide pool,
            # tufte/bib/book-pool.html) and cites them all, some author-year
            # and some from the previous chapter; the same authors and years
            # recur in every chapter, so plainnat's extra labels (2000a,
            # 2000b…, tufte/bib/extra.html) group 1200 entries across the
            # book. With the book's bibliography results only in
            # partialCached (not memoised in .Store), this takes minutes.
            {
              printf -- '---\ntitle: Chapter %d\nweight: %d\nreferences:\n' "$i" "$i"
              for r in 0 1 2 3 4 5; do
                printf '  k%d_%d: {type: book, author: "Author%d, A", title: "T%d", year: %d, publisher: P}\n' "$i" "$r" $(( r % 3 )) "$i" $(( 2000 + r ))
              done
              printf -- '---\n'
              for r in 3 4 5; do printf 'Also {{< cite "k%d_%d" >}}.\n\n' "$i" "$r"; done
              printf 'As {{< cite keys="k%d_0" mode="text" >}} and {{< cite keys="k%d_1" mode="paren" >}} show {{< cite "k%d_2" >}}, after {{< cite keys="k%d_0" mode="text" >}} {{< cite "k%d_1" >}}.\n\n' "$i" "$i" "$i" "$p" "$p"
              # A theorem per chapter, numbered through the book
              # (tufte/book/thm-offset-map.html), and a reference to the
              # previous chapter's.
              printf '{{< theorem "Chapter %d" "thm:c%d" >}}\nStatement %d, after {{< xref "thm:c%d" "full" >}}.\n{{< /theorem >}}\n\n' "$i" "$i" "$i" "$p"
            } > "$f"
            for s in 0 1 2 3; do
              printf '## Section %d {#sec:c%d-s%d}\n\n' "$s" "$i" "$s" >> "$f"
              for n in 0 1 2; do
                printf 'Text{{< sidenote >}}note %d.%d with $x_%d\x24{{< /sidenote >}} {{< index "term%d!sub%d" >}} see {{< xref "fig:c%d-f%d" "full" >}} {{< cite "tufte2006" >}}.\n\n' "$s" "$n" "$n" "$n" "$s" "$p" "$s" >> "$f"
              done
              printf '{{< figure src="/x.png" caption="Figure %d-%d" label="fig:c%d-f%d" >}}\n\n' "$i" "$s" "$i" "$s" >> "$f"
            done
          done
          printf -- '---\ntitle: Figures\nmatter: back\nweight: 1\n---\n{{< listoffigures heading="" >}}\n' > "$B/content/books/big/zz-figs.md"
          printf -- '---\ntitle: Bibliography\nmatter: back\nweight: 2\n---\n{{< bibliography heading="" >}}\n' > "$B/content/books/big/zz-bib.md"
          printf -- '---\ntitle: Index\nmatter: back\nweight: 3\n---\n{{< printindex >}}\n' > "$B/content/books/big/zz-index.md"
          start=$(date +%s)
          timeout 240 hugo --source "$B" --destination "$B/public" --panicOnWarning --templateMetrics > "$RUNNER_TEMP/bigbook-build.log" 2>&1 || { cat "$RUNNER_TEMP/bigbook-build.log"; echo "::error::the big book did not build"; exit 1; }
          echo "built in $(( $(date +%s) - start ))s"
          runs=$(awk '$NF == "_partials/func/content-raw.html" { print $(NF-1) }' "$RUNNER_TEMP/bigbook-build.log")
          echo "func/content-raw.html ran $runs times"
          [ -n "$runs" ] && [ "$runs" -lt $(( 24 * N )) ] || { echo "::error::func/content-raw.html ran $runs times for $N chapters: the .Store memos are recomputed within one build"; exit 1; }
          L=$(printf %03d "$N")
          # Chapter N refers to the first figure of chapter N-1: (N-2) × 4 + 1.
          fig=$(( (N - 2) * 4 + 1 ))
          grep -q ">Figure&nbsp;$fig</a>" "$B/public/books/big/ch$L/index.html" || { echo "::error::cross-chapter xref not resolved"; exit 1; }
          # Chapter N's theorem is Theorem N and refers to Theorem N-1.
          grep -q "data-key=\"thm-c$N\">$N</span>" "$B/public/books/big/ch$L/index.html" || { echo "::error::the theorems are not numbered through the book"; exit 1; }
          grep -q "#thm-c$(( N - 1 ))\">Theorem&nbsp;$(( N - 1 ))</a>" "$B/public/books/big/ch$L/index.html" || { echo "::error::cross-chapter theorem xref not resolved"; exit 1; }
          grep -q -- "-fig-c$N-f3\"" "$B/public/books/big/print.html" || { echo "::error::print document incomplete"; exit 1; }
          # The extra labels of a chapter's own entry and of an earlier
          # chapter's, cited author-year in the last chapter, are the ones
          # their bibliography items show.
          for c in "$N" $(( N - 1 )); do
            lab=$(grep -o "id=\"ref-k${c}_0\" class=\"bib-entry\">A Author0. <cite>T$c</cite>. P, 2000[a-z][0-9]*\." "$B/public/books/big/zz-bib/index.html" | sed 's/.*2000\([a-z][0-9]*\)\.$/\1/')
            [ -n "$lab" ] || { echo "::error::no extra label on the reference k${c}_0 in the bibliography"; exit 1; }
            grep -q "data-cite=\"k${c}_0\">Author0 (2000$lab)</span>" "$B/public/books/big/ch$L/index.html" || { echo "::error::author-year citation of k${c}_0 without the extra label 2000$lab"; exit 1; }
          done
          # The same book under `hugo server`, the live-editing mode: the
          # .Store memos (tufte/memo.html) must keep it as fast as a one-shot
          # build, and must not survive a rebuild: a figure added to chapter 1
          # renumbers the reference in the last chapter, and removing it
          # again (a second rebuild: the build stamp changes at the end of
          # every build) restores the number.
          log="$RUNNER_TEMP/bigbook-server.log"
          hugo server --source "$B" --bind 127.0.0.1 --port 1414 --renderToMemory > "$log" 2>&1 &
          srv=$!
          trap 'kill "$srv" 2>/dev/null || true' EXIT
          for i in $(seq 1 90); do
            grep -q 'Web Server is available' "$log" && break
            kill -0 "$srv" 2>/dev/null || { cat "$log"; echo "::error::hugo server exited"; exit 1; }
            sleep 1
          done
          grep -q 'Web Server is available' "$log" || { cat "$log"; echo "::error::hugo server not ready within 90s"; exit 1; }
          curl -fsS "http://127.0.0.1:1414/books/big/ch$L/" | grep -q ">Figure&nbsp;$fig</a>" || { echo "::error::hugo server: cross-chapter xref not resolved"; exit 1; }
          cp "$B/content/books/big/ch001.md" "$RUNNER_TEMP/ch001.md.orig"
          sed -i 's/^## Section 0 {#sec:c1-s0}$/{{< figure src="\/x.png" caption="New" label="fig:new" >}}\n\n&/' "$B/content/books/big/ch001.md"
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:1414/books/big/ch$L/" | grep -q ">Figure&nbsp;$(( fig + 1 ))</a>"; then ok=1; break; fi
            sleep 1
          done
          [ "$ok" = 1 ] || { cat "$log"; echo "::error::hugo server: an edit of chapter 1 did not renumber chapter $N"; exit 1; }
          cp "$RUNNER_TEMP/ch001.md.orig" "$B/content/books/big/ch001.md"
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:1414/books/big/ch$L/" | grep -q ">Figure&nbsp;$fig</a>"; then ok=1; break; fi
            sleep 1
          done
          [ "$ok" = 1 ] || { cat "$log"; echo "::error::hugo server: a second edit of chapter 1 did not renumber chapter $N"; exit 1; }

      # Footnotes inside footnotes and other edge cases of the Markdown
      # footnote engine (func/footnotes.html, tufte/fn-split.html): the
      # markers must never nest, every reference must reach its note, ids
      # must stay unique, and a [^x] in an image title or table caption, or
      # a second reference to a label, must not change the kind of the
      # page's other notes.
      - name: Check nested and mixed footnotes
        shell: bash
        run: |
          set -euo pipefail
          N="$RUNNER_TEMP/nested"
          mkdir -p "$N/content/posts" "$N/static"
          cp static/images/latex/hilbertcurves.svg "$N/static/h.svg"
          cat > "$N/hugo.toml" <<EOF
          baseURL = "https://example.org/"
          title = "Nested footnotes"
          theme = "tufte.hugo"
          themesDir = "$GITHUB_WORKSPACE"
          mainSections = ["posts"]
          [markup.goldmark.parser]
            wrapStandAloneImageWithinParagraph = false
            [markup.goldmark.parser.attribute]
              block = true
              title = true
          [markup.goldmark.extensions.passthrough]
            enable = true
            [markup.goldmark.extensions.passthrough.delimiters]
              inline = [['\$', '\$']]
          EOF
          cd "$N/content/posts"
          printf -- '---\ntitle: A\ndate: 2024-01-01\n---\n\nCase A {{< footnote >}}inner with [^f]{{< /footnote >}} end.\n\nCase D {{< sidenote >}}side with {{< footnote >}}fn with [^g]{{< /footnote >}} inside{{< /sidenote >}} end.\n\n{{< fig src="/h.svg" >}}Caption {{< footnote >}}fn with [^h]{{< /footnote >}} end{{< /fig >}}\n\n[^f]: F def.\n[^g]: G def.\n[^h]: H def.\n' > a.md
          printf -- '---\ntitle: F\ndate: 2024-01-02\n---\n\nCase F1[^fn-r] and F2[^fn-p] and another[^fn-z] and a side[^x].\n\n[^fn-r]: Real with {{< footnote >}}nested sc{{< /footnote >}} hmm.\n[^fn-p]: Real with [^fn-s] hmm.\n[^fn-s]: S def.\n[^fn-z]: Z def.\n[^x]: Side refers to [^fn-q].\n[^fn-q]: Inner real q.\n' > f.md
          printf -- '---\ntitle: T\ndate: 2024-01-03\n---\n\nA proof.[^fn-proof] An aside.[^why]\n\n![A curve](/h.svg "Hilbert curves.[^fn-src]")\n\n| a | b |\n|---|---|\n| 1 | 2 |\n{#tab:t caption="A table.[^fn-tsrc]"}\n\n[^fn-proof]: The proof.\n[^why]: An aside.\n[^fn-src]: Source of the figure.\n[^fn-tsrc]: Source of the table.\n' > t.md
          printf -- '---\ntitle: R\ndate: 2024-01-04\nfootnotes: endnotes\n---\n\nTwice[^1] and again[^1] and[^1-2].\n\nBody[^fn-x] text.\n\n{{< table caption="T" >}}\n| a | b |\n|---|---|\n| c[^fn-x] | d |\n{{< /table >}}\n\n[^1]: One.\n[^1-2]: One-two.\n[^fn-x]: Shared.\n' > r.md
          printf -- '---\ntitle: M\ndate: 2024-01-05\n---\n\nThree.[^fn-a][^fn-b][^fn-c] Mixed.[^s][^fn-d][^t]\n\n[^fn-a]: A.\n[^fn-b]: B.\n[^fn-c]: C.\n[^fn-d]: D.\n[^s]: S.\n[^t]: T.\n' > m.md
          printf -- '---\ntitle: D\ndate: 2024-01-06\n---\n\n{{< details summary="D" >}}\nOnly a real footnote here[^fn-y].\n{{< /details >}}\n\nAfter{{< sidenote label="sn:e" >}}E{{< /sidenote >}} is note {{< xref "sn:e" >}}.\n\n[^fn-y]: Real Y with{{< sidenote label="sn:f" >}}F{{< /sidenote >}}.\n' > d.md
          printf -- '---\ntitle: E\ndate: 2024-01-07\n---\n\n{{< details summary="D" >}}\nA side{{< sidenote >}}D{{< /sidenote >}}, a real one[^fn-y] and {{< footnote >}}fn {{< sidenote >}}X{{< /sidenote >}} text{{< /footnote >}} then{{< sidenote >}}Y{{< /sidenote >}} end.\n{{< /details >}}\n\nAfter{{< sidenote label="sn:e" >}}E{{< /sidenote >}} is note {{< xref "sn:e" >}}.\n\n[^fn-y]: Real Y with{{< sidenote label="sn:f" >}}F{{< /sidenote >}}.\n' > e.md
          # KaTeX writes <span></span> in every subscript; a footnote nested
          # in a real footnote must still unnest (tufte/fn-unnest.html).
          # A linked stand-alone image as the first block of a theorem and the
          # last block of a proof stays a figure (func/content-raw.html).
          printf -- '---\ntitle: L\ndate: 2024-01-09\n---\n\n{{< theorem >}}\n[![A curve](/h.svg "Linked caption.")](https://example.org/)\n\nText after.\n{{< /theorem >}}\n\n{{< proof >}}\nText before.\n\n[![A curve](/h.svg)](https://example.org/)\n{{< /proof >}}\n' > l.md
          # theorems.qed = none: a \qedhere prints nothing, or the symbol of
          # the proof or kind that holds it (no leftover nest token).
          cat > q.md <<'QEDNONE'
          ---
          title: Q
          date: 2024-01-10
          tufte:
            theorems:
              qed: none
              kinds:
                example: {qed: "◇"}
          ---

          {{< proof >}}
          Cases:

          - one
          - two.{{< qedhere >}}
          {{< /proof >}}

          {{< proof qed="openbox" >}}
          We have

          {{< equation >}}a = b. \qedhere{{< /equation >}}
          {{< /proof >}}

          {{< example >}}
          Consider

          - one
          - two{{< qedhere >}}
          {{< /example >}}
          QEDNONE
          printf -- '---\ntitle: K\ndate: 2024-01-08\n---\n\nBody with real[^fn-cap] end.\n\n{{< figure src="/h.svg" caption="Cap with real[^fn-cap] end." >}}\n\n{{< listoffigures >}}\n\n[^fn-cap]: Cap real $c_0$.[^fn-deep]\n[^fn-deep]: Deep $d_0$.\n' > k.md
          hugo --source "$N" --destination "$N/public" --panicOnWarning
          cd "$N/public"
          fail() { echo "::error::$1"; exit 1; }
          for f in posts/*/index.html; do
            ! grep -q 'class="tufte-fn"\|href="#fn:\|fnref:\|TUFTE' "$f" || fail "unresolved footnote in $f"
            [ "$(grep -o '<span[ >]' "$f" | wc -l)" -eq "$(grep -o '</span>' "$f" | wc -l)" ] || fail "unbalanced <span> in $f"
            d=$(grep -o ' id="[^"]*"' "$f" | sort | uniq -d)
            [ -z "$d" ] || fail "duplicate ids in $f: $d"
            for h in $(grep -o 'href="#[^"]*"' "$f" | sed 's/^href="#//; s/"$//' | sort -u); do
              grep -q " id=\"$h\"" "$f" || fail "dangling link #$h in $f"
            done
          done
          # Inner notes are kept, as their own footnotes, after the outer one
          # (with the \multfootsep comma between the two marks).
          grep -q 'Case A <sup class="footnote-ref"[^>]*><a [^>]*>[^<]*</a></sup><sup class="footnote-sep">,</sup><sup class="footnote-ref" id="fnref-[^"]*-f">' posts/a/index.html || fail "case A: inner footnote not after the outer mark"
          grep -q '<span class="sidenote">side with <sup[^>]*>.*</sup> inside</span> end' posts/a/index.html || fail "case D: sidenote text broken"
          grep -q '<span class="caption-text">Caption <sup.*</sup> end</span>' posts/a/index.html || fail "case H: caption text broken"
          for t in 'nested sc' 'S def.' 'Z def.' 'Inner real q.'; do grep -q "$t" posts/f/index.html || fail "note text \"$t\" lost"; done
          grep -q '<li id="fn-[^"]*-fn-z" class="footnote-item"' posts/f/index.html || fail "[^fn-z] is not a real footnote"
          # [^x] in an image title or table caption does not turn [^fn-proof] into a sidenote.
          grep -q '<li id="fn-[^"]*-fn-proof" class="footnote-item"' posts/t/index.html || fail "[^fn-proof] is not a real footnote"
          grep -q '<span class="sidenote">An aside.</span>' posts/t/index.html || fail "[^why] is not a sidenote"
          # One item per footnote, also when referenced from a shortcode.
          [ "$(grep -o 'class="footnote-item"' posts/r/index.html | wc -l)" -eq 3 ] || fail "posts/r: expected 3 footnote items"
          # \multfootsep: adjacent marks are separated by a superscript comma.
          [ "$(grep -o '<sup class="footnote-sep">,</sup><sup class="footnote-ref"' posts/m/index.html | wc -l)" -eq 3 ] || fail "posts/m: adjacent footnote marks without a comma"
          grep -q '</sup><label for="[^"]*" class="margin-toggle sidenote-number sidenote-number--multi"' posts/m/index.html || fail "posts/m: sidenote mark after a footnote mark without a comma"
          # A closed <details> steps the sidenote counter by the marks it
          # hides (sn-skip-details), not by those in the text of a real
          # footnote referenced inside it (that text goes to the footnote list).
          ! grep -q 'sn-skip-details' posts/d/index.html || fail "posts/d: sn-skip-details for marks inside a real footnote"
          grep -q 'class="xref" href="#sn-e">1<' posts/d/index.html || fail "posts/d: xref to sn:e is not 1"
          [ "$(grep -o 'class="sn-skip-details"[^>]*>' posts/e/index.html)" = 'class="sn-skip-details" aria-hidden="true" style="--sn-skip: 2">' ] || fail "posts/e: expected one sn-skip-details of 2"
          grep -q 'class="xref" href="#sn-e">3<' posts/e/index.html || fail "posts/e: xref to sn:e is not 3"
          # Subscript math in nested real footnotes (posts/k).
          ! grep -q 'tufte-p' posts/k/index.html || fail "posts/k: leaked tufte-p marker"
          grep -q '<p>Body with real<sup class="footnote-ref"[^>]*><a [^>]*>1</a></sup><sup class="footnote-sep">,</sup><sup class="footnote-ref"[^>]*><a [^>]*>2</a></sup> end\.</p>' posts/k/index.html || fail "posts/k: body paragraph broken"
          grep -q '<span class="caption-text">Cap with real<sup class="footnote-ref"[^>]*><a [^>]*>1</a></sup> end\.</span>' posts/k/index.html || fail "posts/k: caption text broken"
          grep -q '<span class="lof-num">1</span> Cap with real end\.</a>' posts/k/index.html || fail "posts/k: list-of-figures entry broken"
          ! grep -q '<p></li>' posts/k/index.html || fail "posts/k: unclosed <p> in the footnote list"
          grep -q '<li id="fn-[^"]*-fn-deep" class="footnote-item"[^>]*><p>Deep ' posts/k/index.html || fail "posts/k: [^fn-deep] item missing"
          grep -q '<p class="thm-headline">.*</span></p><figure class="tufte-figure" id="[^"]*">' posts/l/index.html || fail "posts/l: the linked image that opens a theorem is not a figure after the head line"
          grep -q '<span class="caption-text">Linked caption.</span>' posts/l/index.html || fail "posts/l: the linked image's title is not its caption"
          grep -q '</a></figure><p class="thm-qed-line">' posts/l/index.html || fail "posts/l: the linked image that ends a proof is not a figure before the QED line"
          grep -q '<li>two\.</li>' posts/q/index.html || fail "posts/q: an unclaimed \\qedhere with theorems.qed = none is not removed"
          ! grep -q 'thm-qed-none\|thm-qed-line' posts/q/index.html || fail "posts/q: a \\qedhere placeholder or a QED line is left"
          grep -q 'data-qedhere="2">□</span></span>' posts/q/index.html || fail "posts/q: the proof's qed= symbol does not take the \\qedhere place in the display"
          grep -q '<li>two<span class="thm-qed thm-qed-text" role="img" aria-label="[^"]*" data-qedhere="2">◇</span></li>' posts/q/index.html || fail "posts/q: the example's symbol does not take the \\qedhere place"
          # Automatic summaries are closed before "Read more".
          for f in index.html posts/index.html; do
            [ "$(grep -o '<span[ >]' "$f" | wc -l)" -eq "$(grep -o '</span>' "$f" | wc -l)" ] || fail "unbalanced <span> in $f"
          done
